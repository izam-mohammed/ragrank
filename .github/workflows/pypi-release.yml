# Publishes to PyPI with Trusted Publishing (OIDC) — no API token.
#
# Build and publish are separate jobs on purpose: only `publish` holds
# id-token: write, so a malicious build dependency cannot mint a PyPI
# credential. The `pypi` environment gates the publish step.
#
# Requires a trusted publisher configured at
# https://pypi.org/manage/project/ragrank/settings/publishing/
#   owner: izam-mohammed   repo: ragrank
#   workflow: pypi-release.yml   environment: pypi

name: Release on PyPI

on:
  release:
    types: [created]

permissions: {}

jobs:
  build:
    name: Build distributions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Caching is off deliberately: a poisoned cache on a release build would
      # be baked into the published artifact. Release builds start clean.
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: false

      - name: Build
        run: uv build

      - name: Check metadata
        run: uvx twine check dist/*

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/p/ragrank
    permissions:
      id-token: write   # OIDC for Trusted Publishing — this job only
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
